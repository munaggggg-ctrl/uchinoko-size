name: selftest

# 認証情報が実際に通るかだけを確認する。
# push のたびに走らせて、鍵の失効や設定ミスを早期に検知する。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: テスト
        run: python3 tests/run.py

      - name: 楽天APIの疎通確認
        env:
          RAKUTEN_APP_ID:       ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY:   ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          WP_URL:               ${{ secrets.WP_URL }}   # Referer に使う
        run: python3 -m pipeline.rakuten

      - name: WordPress REST API の疎通確認
        # WP_APP_PASS 未登録のうちは publish 側が黙ってスキップする
        env:
          WP_URL:      ${{ secrets.WP_URL }}
          WP_USER:     ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
        run: python3 -m pipeline.publish

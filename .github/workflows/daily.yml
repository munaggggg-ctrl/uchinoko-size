name: daily

# 常時稼働の実体。CEOのPCが電源OFFでも、Claudeのセッションが切れても回る。
on:
  schedule:
    - cron: "0 20 * * *"      # UTC 20:00 = JST 翌05:00
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false    # 二重起動を防ぐ（無限ループ防止の一環）

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # data/ の差分をコミットして戻すため
    timeout-minutes: 20         # 暴走時の上限
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: テスト
        run: python3 tests/run.py

      # 以下の工程は Day 8 以降に実装する。
      # 未実装のうちは黙ってスキップし、毎朝の失敗通知を出さないようにする。
      - name: 収集と正規化
        if: hashFiles('pipeline/collect.py') != ''
        env:
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          DAILY_TOKEN_CAP: "300000"
        run: python3 -m pipeline.collect

      - name: 記事の下書き
        if: hashFiles('pipeline/draft.py') != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DAILY_TOKEN_CAP:   "150000"
        run: python3 -m pipeline.draft

      - name: 校閲（ERROR があればここで止まる）
        if: hashFiles('build/*.html') != ''
        run: python3 -m pipeline.lint build/*.html

      - name: 公開
        if: hashFiles('pipeline/publish.py') != ''
        env:
          WP_URL:      ${{ secrets.WP_URL }}
          WP_USER:     ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
        run: python3 -m pipeline.publish

      - name: DBの差分をコミット
        run: |
          git config user.name  "koinu-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data build 2>/dev/null || true
          git diff --staged --quiet || {
            git commit -m "daily: $(date -u +%Y-%m-%d)"
            git push
          }

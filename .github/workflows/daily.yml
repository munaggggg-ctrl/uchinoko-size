name: daily

# 常時稼働の実体。CEOのPCが電源OFFでも、Claudeのセッションが切れても回る。
on:
  schedule:
    - cron: "0 20 * * *"      # UTC 20:00 = JST 翌05:00
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false    # 二重起動を防ぐ（無限ループ防止の一環）

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20         # 暴走時の上限
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: テスト
        run: python3 tests/run.py

      - name: 収集と正規化
        env:
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          DAILY_TOKEN_CAP: "300000"     # 日次上限。コード側で強制する
        run: python3 -m pipeline.collect

      - name: 記事の下書き
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DAILY_TOKEN_CAP:   "150000"
        run: python3 -m pipeline.draft

      - name: 校閲（ERROR があればここで止まる）
        run: python3 -m pipeline.lint build/*.html

      - name: 公開
        env:
          WP_URL:      ${{ secrets.WP_URL }}
          WP_USER:     ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
        run: python3 -m pipeline.publish

      - name: DBの差分をコミット
        run: |
          git config user.name  "koinu-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ build/
          git diff --staged --quiet || git commit -m "daily: $(date -u +%Y-%m-%d)"
          git push
